services:
  mongodb:
    image: mongo:7.0
    container_name: lab-prod-mongodb
    restart: always
    expose:
      - "27017"
    environment:
      - MONGO_INITDB_DATABASE=ai-lab
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-SecretMongoPassword123!}
    volumes:
      - mongo_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    networks:
      - lab-prod-network

  redis:
    image: redis:7-alpine
    container_name: lab-prod-redis
    restart: always
    expose:
      - "6379"
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-SecretRedisPassword123!}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping;
        else
          redis-cli ping;
        fi'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - lab-prod-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: lab-prod-ai-service
    restart: always
    expose:
      - "8000"
    environment:
      - APP_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_MOCK_MODE=${AI_MOCK_MODE:-false}
      - AI_ANALYSIS_MODEL=${AI_ANALYSIS_MODEL:-gpt-4o-mini}
      - AI_QUIZ_MODEL=${AI_QUIZ_MODEL:-gpt-4o-mini}
      - AI_REPORT_MODEL=${AI_REPORT_MODEL:-gpt-4o}
      - AI_LEARNING_PATH_MODEL=${AI_LEARNING_PATH_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - lab-prod-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lab-prod-backend
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-SecretMongoPassword123!}@mongodb:27017/ai-lab?authSource=admin}
      - MONGODB_DB_NAME=ai-lab
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-SecretRedisPassword123!}
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - lab-prod-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lab-prod-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - lab-prod-network

  certbot:
    image: certbot/certbot:latest
    container_name: lab-prod-certbot
    restart: "no"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - lab-prod-network

volumes:
  mongo_prod_data:
  redis_prod_data:
  certbot_conf:
  certbot_www:

networks:
  lab-prod-network:
    driver: bridge
